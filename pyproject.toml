[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "mainnet: runs against the immutable deployed mainnet PoolV3 contract (cached after first fetch)",
]

[project]
name = "onboardme"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "slither-analyzer>=0.11.4",
]
